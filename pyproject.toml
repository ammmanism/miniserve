[project]
name = "miniserve"
version = "0.1.0"
description = "Minimal LLM serving engine — correctness first, speed second."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "torch==2.5.1",
    "triton==3.1.0",
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "pydantic>=2.0.0,==2.10.2",
    "prometheus-client==0.21.1",
    "numpy==2.1.3",
    "pandas==2.2.3",
    "matplotlib==3.9.3",
    "httpx==0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
]
otel = [
    "opentelemetry-sdk>=1.43.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.43.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
