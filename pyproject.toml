[project]
name = "miniserve"
version = "1.0.0"
description = "Minimal LLM serving engine — correctness first, speed second."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

dependencies = [
    "torch==2.14.1",
    # triton ships CUDA/ROCm wheels only — the engine imports it behind a
    # guard (kernels/paged_attn_triton.py), so it is not required on
    # Windows/macOS (CPU-only) environments.
    "triton==3.8.0; platform_system == 'Linux'",
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.3",
    "prometheus-client==0.26.0",
    "numpy==2.2.6",
    "pandas==2.3.3",
    "matplotlib==3.10.9",
    "httpx==0.28.1",
]

[project.scripts]
miniserve = "miniserve.cli:main"

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "transformers==5.20.2",
    "pip-audit==2.10.1",
]
otel = [
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# kernels/ is an importable package (triton flash decode) and must ship in
# the wheel next to miniserve/.
packages = ["miniserve", "kernels"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "gpu: requires a CUDA device (auto-skipped on CPU-only runners)",
    "slow: long-running tests excluded from the CI matrix fast pass",
]
