# Grype configuration — phase-11 audit waivers.
#
# These are NOT "the scan is wrong" waivers; they are a scoped, dated
# allowance for known-vulnerable pinned runtime deps, tracked for removal
# in https://github.com/ammmanism/miniserve/issues/12.
#
#   - torch 2.5.1:      al advisories are fixed in torch >= 2.13.0 (or are
#                       local-attack-only with no fixed version yet); the bump
#                       requires a fresh committed parity + benchmark pass.
#   - starlette 0.41.3: fixed at starlette >= 1.3.1; requires the fastapi bump.
#   - pytest 8.3.3:     dev-only dependency, never shipped in the wheel.
#
# Remove entries as the bumps land. No NEW waivers without a linked issue.

